name: Extension release candidate
on:
  push:
    branches: [main]
    paths: [apps/extension/manifest.json]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing extension tag (extension-vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            RELEASE_TAG=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const { version } = JSON.parse(readFileSync("apps/extension/manifest.json", "utf8"));
              console.log(`extension-v${version}`);
            ')
          fi
          if [[ ! "$RELEASE_TAG" =~ ^extension-v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid extension release tag" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
            git merge-base --is-ancestor "$commit" HEAD
            git checkout --detach "$commit"
          else
            commit=$(git rev-parse HEAD)
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              existing=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
              if [[ "$existing" != "$commit" ]]; then
                echo "Version already released; increment the manifest version" >&2
                exit 1
              fi
            fi
          fi
          export RELEASE_TAG
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("apps/extension/manifest.json", "utf8"));
            if (process.env.RELEASE_TAG !== `extension-v${version}`) {
              throw new Error("Release tag must match the manifest version");
            }
          '

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Package extension
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/package-extension.mjs "$RELEASE_TAG"
      - name: Tag verified release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null); then
            test "$existing" = "$RELEASE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA"
          fi
      - name: Retain release candidate
        uses: actions/upload-artifact@v4
        with:
          name: app-feedback-${{ steps.release.outputs.tag }}-${{ steps.release.outputs.sha }}
          path: dist/extension-release/*
          if-no-files-found: error
          retention-days: 7
