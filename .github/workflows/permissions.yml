name: Extension permissions
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install native input dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-xkb-utils xkb-data libx11-6 libxtst6
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:permissions
